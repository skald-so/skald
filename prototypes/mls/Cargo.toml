[workspace]
members = ["scenario", "openmls", "mls-rs", "interop", "bench"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# The WASM modules whose size `wasm-size` reports: a release build for size.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# Debug builds and tests: as in the root Cargo.toml.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
