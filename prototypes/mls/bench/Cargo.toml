[package]
name = "mls-bench"
description = "Benchmarks of Skald's MLS prototypes: each channel operation on OpenMLS and mls-rs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mls-scenario = { path = "../scenario" }
# The clock: `std::time::Instant` on native targets, the browser's on WASM.
web-time = "1"

[dev-dependencies]
mls-proto-mls-rs = { path = "../mls-rs" }
mls-proto-openmls = { path = "../openmls" }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# The benchmarks natively, run by `bench`: `cargo bench` prints their tables.
[[bench]]
name = "channel"
harness = false

# The browser's GroupInfo check in WASM, run by `bench` in Node.js.
[[example]]
name = "mls-bench-browser-check"
path = "examples/browser_check.rs"
crate-type = ["cdylib"]
