[package]
name = "agent-hook"
description = "A Claude Code and Codex hook handler that hands the waiting messages to the agent after a tool call, at the end of a turn and, on Codex, with the next prompt."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-inbox = { path = "../inbox" }
agent-source = { path = "../source" }
serde_json = "1"

[dev-dependencies]
agent-testing = { path = "../testing" }
tempfile = "3"
