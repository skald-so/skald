[package]
name = "agent-live"
description = "Live checks of each delivery path against the installed Claude Code and Codex."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-inbox = { path = "../inbox" }
agent-source = { path = "../source" }
libc = "0.2"
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "live-check"
path = "src/main.rs"

[dev-dependencies]
agent-testing = { path = "../testing" }
