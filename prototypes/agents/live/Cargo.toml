[package]
name = "agent-live"
description = "Live checks of each delivery path and of the limits data against the installed Claude Code and Codex."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-app-server = { path = "../app-server" }
agent-inbox = { path = "../inbox" }
agent-limits = { path = "../limits" }
agent-queue = { path = "../queue" }
agent-socket = { path = "../socket" }
agent-source = { path = "../source" }
agent-transcript = { path = "../transcript" }
libc = "0.2"
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "live-check"
path = "src/main.rs"

[dev-dependencies]
agent-testing = { path = "../testing" }
