[package]
name = "agent-inbox"
description = "A stdio MCP server whose `inbox` tool hands the waiting messages to the agent."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-source = { path = "../source" }
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3"
