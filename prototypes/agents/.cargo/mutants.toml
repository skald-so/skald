# Code that script/mutants skips in the delivery prototypes' workspace; the tests cannot catch its
# mutants.
# The live checks' code that runs the installed agent CLIs, which script/test does not; and the
# code the tests share, which is itself test code.
exclude_globs = [
  "live/src/run.rs",
  "live/src/pty.rs",
  "live/src/app.rs",
  "live/src/subscription.rs",
  "live/src/wake_run.rs",
  "live/src/read_run.rs",
  "testing/src/lib.rs",
]
# cargo-mutants builds and tests only the mutated packages in its baseline run; live-check's tests
# also need the server, hook handler, queue prototype, app-server client and limits prototype
# binaries. `--workspace` would repeat in the mutants' runs, which cargo refuses.
additional_cargo_args = [
  "--package=agent-inbox",
  "--package=agent-channel",
  "--package=agent-hook",
  "--package=agent-queue",
  "--package=agent-app-server",
  "--package=agent-limits",
]
