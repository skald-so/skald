# Code that script/mutants skips in the delivery prototypes' workspace; the tests cannot catch its
# mutants.
# The live checks' code that runs the installed agent CLIs, which script/test does not; and the
# code the tests share, which is itself test code.
exclude_globs = [
  "live/src/run.rs",
  "live/src/pty.rs",
  "live/src/app.rs",
  "live/src/subscription.rs",
  "live/src/wake_run.rs",
  "live/src/read_run.rs",
  "live/src/permission_run.rs",
  "live/src/before_run.rs",
  "live/src/codex_before_run.rs",
  "testing/src/lib.rs",
  # What only Windows builds; script/test runs on macOS and Linux.
  "live/src/windows.rs",
  "source/src/unix_socket.rs",
]
# cargo-mutants builds and tests only the mutated packages in its baseline run; live-check's tests
# also need the server, hook handler, queue prototype, app-server client and limits prototype
# binaries. `--workspace` would repeat in the mutants' runs, which cargo refuses.
additional_cargo_args = [
  "--package=agent-inbox",
  "--package=agent-channel",
  "--package=agent-hook",
  "--package=agent-queue",
  "--package=agent-app-server",
  "--package=agent-limits",
]
# cargo-mutants copies only this workspace; the tests of the live checks' report read
# docs/dev/agent-delivery.md outside it, so they run only in script/test.
additional_cargo_test_args = [
  "-E",
  "not (test(=the_report_gives_each_claude_code_checks_result_and_version_on_the_stub_and_the_real_model) | test(=the_report_gives_each_codex_checks_result_and_version_on_macos_and_linux) | test(=the_report_says_which_read_only_limits_codex_enforces_and_what_an_executor_takes) | test(=the_codex_items_of_checks_before_implementation_link_to_their_findings))",
]
