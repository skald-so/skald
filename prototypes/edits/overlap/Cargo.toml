[package]
name = "edit-overlap"
description = "Finds edit overlaps between machines from HMAC fingerprints, with a scenario harness on local git clones."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hmac = "0.13"
sha2 = "0.11"
tempfile = "3"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-normalization = "0.1"
