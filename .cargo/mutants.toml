# cargo-mutants settings for script/mutants.
# The GitHub stand-in is test code: script/mutants runs only the mutated crate's tests, so only the
# stand-in's own tests could catch its mutants, while the tests that rely on it are other crates'.
exclude_globs = ["crates/github-stand-in/**"]
# The server's sign-in tests drive Chrome: a mutant that leaves a page waiting fails them only after
# their browser timeouts, past the timeout cargo-mutants sets from the unmutated run.
minimum_test_timeout = 400
