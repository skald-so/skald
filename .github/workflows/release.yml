name: Release

# A push of a release tag, vX.Y.Z or vX.Y.Z-beta.N, publishes skald to the tag's GitHub Release: dist
# builds it on a runner of each OS and architecture (dist-workspace.toml), each runner installs it
# with its installer from the release's files, then one job attests every file of the release and
# creates the release with all of them. Another job builds the skald-server image at the tag's
# commit, pushes it to GHCR under its version, signs its digest with cosign and attests it.
# Any other run is the dry run: it builds and checks everything and publishes nothing; a PR that
# changes the release config or this workflow starts it, and so does a manual run.
# Its tests: docs/dev/infrastructure.md, "PR checks", "Tooling".
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/release.yml
      - dist-workspace.toml
      # dist's settings in Cargo.toml: [profile.dist], and the package it releases.
      - Cargo.toml
      - crates/client/Cargo.toml
      - installers/**
      - script/installers-test
      - script/lib/serve.mjs
      - script/release-installers
      - script/release-notes
      - script/release-version
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR replaces its dry run; releases are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release tag of the workspace version; a pushed tag must be it.
      - id: tag
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            version=$(script/release-version "$GITHUB_REF_NAME")
          else
            version=$(script/release-version)
          fi
          echo "tag=v$version" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: &runners
          # Ubuntu 22.04: the binaries run on glibc 2.35 and later.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # dist from the commit of its release tag: taiki-e/install-action does not offer it. Cargo
      # checks each of its dependencies against the checksum in its Cargo.lock.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axodotdev/cargo-dist
          ref: 294c1b25d372d86e74cafead8469b9f36d02da29 # v0.34.0, cargo-dist-version in dist-workspace.toml
          path: cargo-dist
          persist-credentials: false
      - name: Build dist
        run: |
          cargo build --manifest-path cargo-dist/Cargo.toml --locked --bin dist \
            --target-dir "$RUNNER_TEMP/cargo-dist"
          echo "$RUNNER_TEMP/cargo-dist/debug" >>"$GITHUB_PATH"
          rm -rf cargo-dist
      # The archive of skald and its checksum, in target/distrib.
      - name: Build skald
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: dist build --tag="$TAG" --artifacts=local --target="$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: target/distrib/skald-client-${{ matrix.target }}.*
          if-no-files-found: error

  check:
    name: Check ${{ matrix.target }}
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include: *runners
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: release
      # The installer of this OS downloads this runner's archive from the release's files and
      # installs skald; a new shell runs it and it prints the workspace version. It refuses an
      # archive that does not match its checksum, or has none, and installs nothing.
      - name: Install skald
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          script/release-installers "$TAG" release
          script/installers-test release "$TAG" "$TARGET"

  release:
    name: Release
    needs: [plan, check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Attests the release's files and creates the release.
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: release
      - name: Write the installers
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: script/release-installers "$TAG" release
      # Every file of the release, the installers and checksums included, gets a build provenance
      # attestation of this workflow at the tag's ref before the release is published.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      # One release of the tag with all its files: gh uploads them to a draft and publishes it once
      # they are all there, and an immutable release never changes after that. Its notes are the
      # version's CHANGELOG section; a beta's release is a prerelease.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          script/release-notes "${TAG#v}" >"$RUNNER_TEMP/notes.md"
          prerelease=()
          [[ $TAG != *-* ]] || prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}" release/*

  # The dry run's build of the release image, as job publish-image builds it.
  image:
    name: Image
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/server/Dockerfile
          build-args: REVISION=${{ github.sha }}
          push: false

  publish-image:
    name: Publish the image
    needs: plan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Pushes and signs the image, and attests it.
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/skald-so/skald-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image's tag is the version, X.Y.Z or X.Y.Z-beta.N. A version GHCR already has is not
      # pushed again: the job fails before it builds.
      - id: version
        name: Check that GHCR has no image of the version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version=${TAG#v}
          if found=$(docker buildx imagetools inspect "$IMAGE:$version" 2>&1); then
            echo "::error::GHCR already has $IMAGE:$version; a version is pushed once"
            exit 1
          elif [[ $found != *": not found"* ]]; then
            echo "$found" >&2
            exit 1
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
      # The image definition script/image-test tests, built at the tag's commit with no cache.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/server/Dockerfile
          build-args: REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          push: true
      # The installer's bootstrap version, which it checks against a checksum of its own.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # Keyless: the certificate names this workflow at the tag's ref.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
