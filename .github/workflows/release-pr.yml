name: Release PR and tag

# Every push to dev tags the merge of a Release PR with script/release-tag, then opens the Release
# PR or updates the open one with script/release-pr: the next version and the PRs merged since the
# last release in CHANGELOG.md, by the git-cliff of script/install-git-cliff and cliff.toml.
# script/release-pr-workflow-test and script/release-tag-workflow-test test this file.
on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  # No concurrency group: a later push replaces a run waiting in one, and the merge of a Release PR
  # would stay untagged. Each run tags only its own commit.
  release-tag:
    name: Release tag
    runs-on: ubuntu-latest
    # The App's secrets; only dev deploys from it.
    environment: release-plz
    steps:
      # The whole history and the tags: a version already tagged gets no tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A token of the GitHub App skald-release: the workflows that run on tags start on a tag it
      # creates, unlike on one created with the job's own token. It reads the PRs of the public
      # repository without a permission for them. Revoked when the job ends.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # Only the merge of a PR the App opened from a branch of this repository is tagged. Not a
      # Release PR's merge, exit code 1: nothing to tag; an error fails the step. script/release-tag
      # tags through the GitHub API, so the checkout needs no credentials.
      - name: Tag the merge of a Release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if script/release-pr-merged; then
            script/release-tag
          else
            status=$?
            [[ $status == 1 ]] || exit "$status"
          fi

  release-pr:
    name: Release PR
    # After the tag, so the Release PR counts the PRs since the release just tagged.
    needs: release-tag
    runs-on: ubuntu-latest
    # The App's secrets; only dev deploys from it.
    environment: release-plz
    # One run at a time; a newer push replaces a waiting run. Runs join the group as their tag jobs
    # end, in any order, so each works on the latest dev and its tags: the run that goes last leaves
    # the Release PR on the latest dev.
    concurrency:
      group: ${{ github.workflow }}-release-pr
      cancel-in-progress: false
    steps:
      # The latest dev, not the pushed commit, with the whole history and the tags: the last release
      # is the last vX.Y.Z tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
          fetch-depth: 0
      # Before the App token exists.
      - name: Install git-cliff
        run: script/install-git-cliff
      # A token of the GitHub App skald-release: PR checks run on a PR it opens, unlike on one opened
      # with the job's own token. Revoked when the job ends.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # It commits and moves the PR branch through the GitHub API, so the checkout needs no
      # credentials.
      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: script/release-pr
