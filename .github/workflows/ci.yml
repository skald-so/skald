name: CI

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job runs one part of script/test, only when the PR changes it: see script/changed-parts.
# A job skipped by its condition counts as passed.
jobs:
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.parts.outputs.rust }}
      tooling: ${{ steps.parts.outputs.tooling }}
      web: ${{ steps.parts.outputs.web }}
    steps:
      # The checkout is the PR merged into dev; its first parent is dev.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: parts
        shell: bash # -o pipefail: a failure of changed-parts fails the step
        run: script/changed-parts HEAD^1 | tee -a "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            prototypes/mls -> target
      # The MLS prototypes' WASM tests need the wasm-bindgen-cli of their Cargo.lock.
      - id: wasm-bindgen
        shell: bash # -o pipefail: a failure of awk fails the step
        run: >-
          awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print "version=" $3 }'
          prototypes/mls/Cargo.lock | tee -a "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # The MLS prototypes' WASM tests run in Node.js.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: rust

  tooling:
    name: Tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests of script/mutants run it on a scratch Cargo workspace.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: tooling

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: web
      # The kit page screenshots that differ from their references, with diff images.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-diff
          path: web/kit-diff/
          if-no-files-found: ignore
