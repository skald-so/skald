      # The WASM tests run in Node.js; the server's and the client's sign-in tests
      # drive the runner's Google Chrome with the playwright-core of web/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: repository

  # The check Rust that dev requires: it passes only when every job of the Rust code passed or was
  # skipped, its part unchanged. It runs whatever they end with, a failure or a cancelled run too:
  # a required check that is skipped counts as passed.
  rust:
    name: Rust
    needs: [changes, rust-workspace, rust-wasm, rust-image, rust-mls, rust-agents, rust-edits, rust-repository]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --raw-output 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq --exit-status '.changes.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

  # The tests of the client, the one crate whose behavior depends on the OS, on Windows; script/test
  # runs them on Linux. Outside script/test, with the workspace part.
  client-windows:
    name: Client on Windows
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.workspace == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The sign-in tests drive the runner's Google Chrome with the playwright-core of web/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the packages of web/
        working-directory: web
        run: npm ci --no-audit --no-fund
      # The image's PostgreSQL, stopped and disabled until started.
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*'
          Set-Service -InputObject $service -StartupType Manual
          Start-Service -InputObject $service
          & "$env:PGBIN\pg_isready" --host 127.0.0.1 --port 5432 --timeout 60
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # PGUSER and PGPASSWORD of the image name its superuser. Every failing test target shows. A
      # fresh runner's Credential Manager is the one key storage a test may use.
      - name: Test the client
        shell: pwsh
        env:
          SKALD_TEST_REAL_KEY_STORAGE: '1'
        run: |
          $env:SKALD_TEST_DATABASE_URL = "postgres://${env:PGUSER}:${env:PGPASSWORD}@127.0.0.1:5432"
          cargo test -p skald-client --locked --no-fail-fast
      # PostgreSQL's side of a failing test: its failures, without the sessions that dropping a
      # test's database ends.
      - name: Show PostgreSQL's failures
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -File -Path "$env:PGDATA\log" | Sort-Object LastWriteTime | Get-Content |
            Where-Object {
              $_ -match 'FATAL|PANIC|WARNING|could not|server process' -and
              $_ -notmatch 'terminating connection due to administrator command'
            }
      # The tests remove the directories they make in the temporary directory, also when one fails:
      # any left, listed with what it holds, fails the job.
      - name: Check that the tests left no directories
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $left = Get-ChildItem -Directory -Path ([IO.Path]::GetTempPath()) |
            Where-Object { $_.Name -like 'skald-update-*' -or $_.Name -like 'skald-client-*' }
          foreach ($dir in $left) {
            "left: $($dir.FullName)"
            Get-ChildItem -Recurse -Name -Path $dir.FullName
          }
          if ($left) { exit 1 }

  tooling:
    name: Tooling
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests of script/mutants run it on a scratch Cargo workspace.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: tooling

  web:
    name: Web
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: web
      # The kit page screenshots that differ from their references, with diff images.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-diff
          path: web/kit-diff/
          if-no-files-found: ignore
