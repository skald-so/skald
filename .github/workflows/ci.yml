        env:
          SKALD_TEST_PARTS: agents

  rust-edits:
    name: 'Rust: edit prototype'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.edits == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
