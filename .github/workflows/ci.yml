        uses: ./.github/actions/install-release-plz
      # The WASM tests run in Node.js; the server's and the client's sign-in tests
      # drive the runner's Google Chrome with the playwright-core of web/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: wasm

  rust-image:
    name: 'Rust: server image'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.image == 'true'
