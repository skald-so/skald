name: CI

on:
  pull_request:
    branches: [dev]
  # After every merge, every part: a check that a PR's selection missed fails on dev.
  push:
    branches: [dev]

permissions:
  contents: read

# A PR's new push cancels the PR's older run; a push to dev has a group of its own, its commit, so
# no run of another push or of a PR cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# On a PR, each job runs its part of script/test only when the PR changes it: see
# script/changed-parts. A job skipped by its condition counts as passed. On a push to dev, every job
# runs.
jobs:
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.parts.outputs.workspace }}
      wasm: ${{ steps.parts.outputs.wasm }}
      image: ${{ steps.parts.outputs.image }}
      mls: ${{ steps.parts.outputs.mls }}
      agents: ${{ steps.parts.outputs.agents }}
      edits: ${{ steps.parts.outputs.edits }}
      repository: ${{ steps.parts.outputs.repository }}
      tooling: ${{ steps.parts.outputs.tooling }}
      web: ${{ steps.parts.outputs.web }}
    steps:
      # The checkout is the PR merged into dev; its first parent is dev.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: parts
        if: github.event_name == 'pull_request'
        shell: bash # -o pipefail: a failure of changed-parts fails the step
        run: script/changed-parts HEAD^1 | tee -a "$GITHUB_OUTPUT"

  # The Rust code: one job per part of script/test, each on a runner of its own with the same tools,
  # those every part needs, and a cache of its own Cargo workspace.
  rust-workspace:
    name: 'Rust: workspace'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
      # The WASM tests of the crates and the MLS prototypes need the wasm-bindgen-cli of the
      # prototypes' Cargo.lock.
      - id: wasm-bindgen
        shell: bash # -o pipefail: a failure of awk fails the step
        run: >-
          awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print "version=" $3 }'
          prototypes/mls/Cargo.lock | tee -a "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # release-plz: the Release PR tests, in the part repository.
      - name: Install release-plz
        uses: ./.github/actions/install-release-plz
      # The WASM tests run in Node.js; the server's and the client's sign-in tests
      # drive the runner's Google Chrome with the playwright-core of web/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: workspace

  rust-wasm:
    name: 'Rust: WASM'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
