      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # release-plz: the Release PR tests, in the part repository.
      - name: Install release-plz
        uses: ./.github/actions/install-release-plz
      # The WASM tests run in Node.js; the server's and the client's sign-in tests
      # drive the runner's Google Chrome with the playwright-core of web/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: mls

  rust-agents:
    name: 'Rust: delivery prototypes'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
