name: CI

on:
  # Not on a draft: every job is skipped until the PR is ready for review.
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  # A run on dev checks every part: a check that a PR's selection missed fails there.
  push:
    branches: [dev]

permissions:
  contents: read

# A PR's new push cancels the PR's older run. Pushes to dev share a group that cancels no running
# run: a newer push replaces only a waiting one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# On a PR, each job runs its part of script/test only when the PR changes it: see
# script/changed-parts. A job skipped by its condition counts as passed. On a push to dev, every job
# runs.
jobs:
  changes:
    name: Changed parts
    # A draft PR skips it, and so every job after it.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.parts.outputs.workspace }}
      wasm: ${{ steps.parts.outputs.wasm }}
      image: ${{ steps.parts.outputs.image }}
      self-host: ${{ steps.parts.outputs.self-host }}
      mls: ${{ steps.parts.outputs.mls }}
      agents: ${{ steps.parts.outputs.agents }}
      edits: ${{ steps.parts.outputs.edits }}
      repository: ${{ steps.parts.outputs.repository }}
      tooling: ${{ steps.parts.outputs.tooling }}
      web: ${{ steps.parts.outputs.web }}
      site: ${{ steps.parts.outputs.site }}
    steps:
      # The checkout is the PR merged into dev; its first parent is dev.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: parts
        if: github.event_name == 'pull_request'
        shell: bash # -o pipefail: a failure of changed-parts fails the step
        run: script/changed-parts HEAD^1 | tee -a "$GITHUB_OUTPUT"

  # The Rust code: one job per part of script/test, each on a runner of its own, with the tools of
  # every part and a cache of the Cargo workspaces it builds.
  # The whole history and the tags: script/release-pr-test, in the part repository, checks the
  # CHANGELOG section of v0.1.0 against them.
  rust-workspace:
    name: 'Rust: workspace'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/rust-tools
        with:
          workspaces: . -> target
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: workspace

  rust-wasm:
    name: 'Rust: WASM'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/rust-tools
        with:
          workspaces: . -> target
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: wasm

  rust-image:
    name: 'Rust: server image'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/rust-tools
        with:
          workspaces: . -> target
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: image

  rust-self-host:
    name: 'Rust: self-host stack'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.self-host == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/rust-tools
        with:
          workspaces: . -> target
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: self-host

  rust-mls:
    name: 'Rust: MLS prototypes'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.mls == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/rust-tools
        with:
          workspaces: prototypes/mls -> target
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: mls

  rust-agents:
    name: 'Rust: delivery prototypes'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/rust-tools
        with:
          workspaces: prototypes/agents -> target
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: agents

  rust-edits:
    name: 'Rust: edit prototype'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.edits == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/rust-tools
        with:
          workspaces: prototypes/edits -> target
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: edits

  rust-repository:
    name: 'Rust: repository'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/rust-tools
        with:
          workspaces: . -> target
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: repository

  # The check Rust that dev requires: it passes only when every job of the Rust code passed or was
  # skipped, its part unchanged. It runs whatever they end with, a failure or a cancelled run too:
  # a required check that is skipped counts as passed. Skipped only on a draft PR, which cannot be
  # merged; marking it ready runs it.
  rust:
    name: Rust
    needs: [changes, rust-workspace, rust-wasm, rust-image, rust-self-host, rust-mls, rust-agents, rust-edits, rust-repository]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --raw-output 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq --exit-status '.changes.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

  # The tests of the client, the one crate whose behavior depends on the OS, on Windows; script/test
  # runs them on Linux. Outside script/test, with the workspace part.
  client-windows:
    name: Client on Windows
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.workspace == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The sign-in tests drive Chrome Headless Shell, installed by the playwright-core of web/ on a
      # cache miss.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ms-playwright-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the packages of web/
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Chrome Headless Shell
        working-directory: web
        run: node node_modules/playwright-core/cli.js install chromium-headless-shell
      # The image's PostgreSQL, stopped and disabled until started, set as script/lib/postgres.sh
      # sets the tests' one: it flushes nothing to the disk, which the client's state shares, and
      # takes the tests' connections.
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          Add-Content -Path "$env:PGDATA\postgresql.conf" -Value 'fsync = off', 'max_connections = 500'
          $service = Get-Service -Name 'postgresql*'
          Set-Service -InputObject $service -StartupType Manual
          Start-Service -InputObject $service
          & "$env:PGBIN\pg_isready" --host 127.0.0.1 --port 5432 --timeout 60
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Windows now and then fails a connect of the tests with WSAENOBUFS (10055), for a cause still
      # unknown. A process started here samples, about every 10 s, the ephemeral ports in use, by
      # state and owner, and the non-paged pool; a retry of such a connect prints the last sample.
      - name: Sample the ephemeral ports in use
        shell: pwsh
        run: |
          $sampler = Join-Path $env:RUNNER_TEMP 'ports.ps1'
          Set-Content -Path $sampler -Value @'
          $start = (Get-NetTCPSetting -SettingName Internet).DynamicPortRangeStartPort
          while ($true) {
            $used = @(Get-NetTCPConnection -ErrorAction SilentlyContinue |
              Where-Object { $_.LocalPort -ge $start -and $_.State -ne 'Listen' })
            $ports = @($used | Sort-Object -Property LocalPort -Unique).Count
            $pool = [int]((Get-Counter '\Memory\Pool Nonpaged Bytes').CounterSamples[0].CookedValue / 1MB)
            $states = ($used | Group-Object State | Sort-Object Count -Descending |
              ForEach-Object { "$($_.Name)=$($_.Count)" }) -join ' '
            $owners = ($used | Where-Object State -ne 'TimeWait' | Group-Object OwningProcess |
              Sort-Object Count -Descending | Select-Object -First 3 |
              ForEach-Object { "$((Get-Process -Id $_.Name -ErrorAction SilentlyContinue).ProcessName)=$($_.Count)" }) -join ' '
            "$(Get-Date -Format HH:mm:ss): $ports ports in use, $states; non-paged pool $pool MB; most: $owners" |
              Add-Content -Path (Join-Path $env:RUNNER_TEMP 'ports.txt')
            Start-Sleep -Seconds 10
          }
          '@
          Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-File', $sampler
      # PGUSER and PGPASSWORD of the image name its superuser. Every failing test target shows. A
      # fresh runner's Credential Manager is the one key storage a test may use.
      - name: Test the client
        shell: pwsh
        env:
          SKALD_TEST_REAL_KEY_STORAGE: '1'
        run: |
          $env:SKALD_TEST_DATABASE_URL = "postgres://${env:PGUSER}:${env:PGPASSWORD}@127.0.0.1:5432"
          $env:SKALD_TEST_PORT_SAMPLES = Join-Path $env:RUNNER_TEMP 'ports.txt'
          cargo test -p skald-client --locked --no-fail-fast
      - name: Show the most ephemeral ports in use
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $samples = @(Get-Content -Path (Join-Path $env:RUNNER_TEMP 'ports.txt'))
          "$($samples.Count) samples; the most ports in use, then the largest non-paged pool:"
          $samples | Sort-Object { [int]($_ -split ' ')[1] } | Select-Object -Last 3
          $samples | Sort-Object { [int]([regex]::Match($_, 'pool (\d+) MB').Groups[1].Value) } |
            Select-Object -Last 1
      # PostgreSQL's side of a failing test: its failures, without the sessions that dropping a
      # test's database ends.
      - name: Show PostgreSQL's failures
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -File -Path "$env:PGDATA\log" | Sort-Object LastWriteTime | Get-Content |
            Where-Object {
              $_ -match 'FATAL|PANIC|WARNING|could not|server process' -and
              $_ -notmatch 'terminating connection due to administrator command'
            }
      # The tests remove the directories they make in the temporary directory, also when one fails:
      # any left, listed with what it holds, fails the job.
      - name: Check that the tests left no directories
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $left = Get-ChildItem -Directory -Path ([IO.Path]::GetTempPath()) |
            Where-Object { $_.Name -like 'skald-update-*' -or $_.Name -like 'skald-client-*' }
          foreach ($dir in $left) {
            "left: $($dir.FullName)"
            Get-ChildItem -Recurse -Name -Path $dir.FullName
          }
          if ($left) { exit 1 }

  tooling:
    name: Tooling
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests of script/mutants run it on a scratch Cargo workspace, with cargo-nextest.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.151
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: tooling

  web:
    name: Web
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The kit tests drive Chrome Headless Shell, which script/test installs with the playwright-core
      # of web/ on a cache miss.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ms-playwright-${{ runner.os }}-${{ runner.arch }}-
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: web
      # The kit page screenshots that differ from their references, with diff images.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-diff
          path: web/kit-diff/
          if-no-files-found: ignore

  site:
    name: Site
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: site
      # The main page screenshots that differ from their references, with diff images.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-references-diff
          path: site/references-diff/
          if-no-files-found: ignore
