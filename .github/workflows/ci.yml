          cache-dependency-path: web/package-lock.json
      - run: ./script/test
        env:
          SKALD_TEST_PARTS: image

  rust-mls:
    name: 'Rust: MLS prototypes'
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.mls == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
