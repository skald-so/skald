name: E2E

# Manual Windows Claude Code receipt diagnostic using the existing model and PostgreSQL fixtures.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude-code:
    name: Claude Code on ${{ matrix.os }}
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The tests sign machines in with Chrome Headless Shell, which the playwright-core of web/
      # installs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Chrome Headless Shell
        shell: bash
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node node_modules/playwright-core/cli.js install chromium-headless-shell
      - name: Install Claude Code 2.1.331
        shell: bash
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.331
          claude --version
      # A PostgreSQL of the runner's own, set as script/lib/postgres.sh sets the tests' one.
      - name: Start PostgreSQL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path "$env:PGDATA\postgresql.conf" -Value 'fsync = off', 'max_connections = 500'
          $service = Get-Service -Name 'postgresql*'
          Set-Service -InputObject $service -StartupType Manual
          Start-Service -InputObject $service
          & "$env:PGBIN\pg_isready" --host 127.0.0.1 --port 5432 --timeout 60
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "SKALD_TEST_DATABASE_URL=postgres://${env:PGUSER}:${env:PGPASSWORD}@127.0.0.1:5432" >> $env:GITHUB_ENV
      - name: E2E tests of Claude Code
        shell: bash
        env:
          SKALD_E2E_REQUIRED: '1'
          SKALD_E2E_TRACE_READ: 'debug'
        run: |
          cargo test -p skald-client --locked --test claude_code_e2e -- --ignored --skip hosts::
      - name: E2E tests of the Claude Code executor
        shell: bash
        env:
          SKALD_E2E_REQUIRED: '1'
        run: cargo test -p skald-adapters --locked --test claude_code_executor -- --ignored
