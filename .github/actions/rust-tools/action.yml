name: Rust tools
description: >-
  The tools of every part of script/test's Rust code: Rust with rustfmt, clippy and the WASM target,
  the cache of the Cargo workspaces a job builds, cargo-deny, wasm-bindgen-cli, release-plz and
  Node.js.
# .github/workflows/ci.yml sets up each job of the Rust code with it; script/ci-workflow-test tests
# that.
inputs:
  workspaces:
    description: The Cargo workspaces to cache, as Swatinem/rust-cache takes them.
    required: true
runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt,clippy \
          --target wasm32-unknown-unknown
        rustup default stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.workspaces }}
    # The WASM tests of the crates and the MLS prototypes need the wasm-bindgen-cli of the
    # prototypes' Cargo.lock.
    - id: wasm-bindgen
      shell: bash # -o pipefail: a failure of awk fails the step
      run: >-
        awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print "version=" $3 }'
        prototypes/mls/Cargo.lock | tee -a "$GITHUB_OUTPUT"
    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-deny@0.20.2,wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
    # release-plz: the Release PR tests, in the part repository.
    - name: Install release-plz
      uses: ./.github/actions/install-release-plz
    # The WASM tests run in Node.js; the server's and the client's sign-in tests
    # drive the runner's Google Chrome with the playwright-core of web/.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: web/package-lock.json
