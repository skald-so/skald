[package]
name = "skald-crypto"
description = "Skald end-to-end encryption core."
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
ed25519-dalek = "3"
skald-proto = { path = "../proto" }

[features]
# Builds the acceptance tests of device certificates, written before the code they test.
# Remove this feature and the [[test]] entry below with that code.
acceptance = []

[[test]]
name = "certificates"
required-features = ["acceptance"]
