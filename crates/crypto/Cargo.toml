[package]
name = "skald-crypto"
description = "Skald end-to-end encryption core."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek = "3"
getrandom = "0.4"
skald-proto = { path = "../proto" }
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1"

[features]
# Builds the acceptance tests of MLS on a device, in tests/mls, written before the code they test.
# Remove this feature and the cfg at the top of tests/mls/main.rs with that code.
acceptance = []

# In WASM: the random generator of the browser or Node.js.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
