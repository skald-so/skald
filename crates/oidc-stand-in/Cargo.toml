[package]
name = "skald-oidc-stand-in"
description = "A local stand-in for an OpenID Connect provider, for tests."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "skald-oidc-stand-in"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
ring = "0.17"
serde_json = "1.0"
tokio = { version = "1.54", features = ["net", "rt-multi-thread"] }
