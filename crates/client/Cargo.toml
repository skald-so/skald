[package]
name = "skald-client"
description = "Skald client: CLI, MCP server and local helper."
version.workspace = true
edition.workspace = true
license.workspace = true

# dist builds and releases this package only: dist-workspace.toml.
[package.metadata.dist]
dist = true

[[bin]]
name = "skald"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skald-proto = { path = "../proto" }
tungstenite = "0.30"
ureq = { version = "3.5", default-features = false }

[dev-dependencies]
axum = "0.8.9"
skald-server = { path = "../server" }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54", features = ["net", "rt-multi-thread"] }
toml = "1.2"
