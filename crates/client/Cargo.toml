[package]
name = "skald-client"
description = "Skald client: CLI, MCP server and local helper."
version.workspace = true
edition.workspace = true
license.workspace = true

# dist builds and releases this package only: dist-workspace.toml.
[package.metadata.dist]
dist = true

[[bin]]
name = "skald"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
gethostname = "1"
# The local page's secret.
getrandom = "0.4"
# Parses an RFC 3339 expiry; no time zone database.
jiff = { version = "0.2", default-features = false, features = ["std"] }
keyring-core = "1"
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
skald-crypto = { path = "../crypto" }
skald-proto = { path = "../proto" }
tar = { version = "0.4", default-features = false }
# The MCP server's runtime, which rmcp needs.
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync"] }
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
# rustls for WSS. The client hands tungstenite its own TLS stream, so tungstenite never loads the
# native roots this feature brings.
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
zeroize = "1"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# History entries a compromised device seals as skald-crypto never would, such as one whose body
# names another channel.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
axum = "0.8.9"
curve25519-dalek = "5"
# The master backup opened with the recovery key a run shows, apart from the code under test.
hkdf = "0.13"
hpke = { version = "0.15", default-features = false, features = ["aes", "alloc", "x25519"] }
# A device the members do not admit, which joins a channel's group by an external Commit.
mls-rs = "0.57.1"
mls-rs-crypto-rustcrypto = "0.23"
# Runs `skald` in a pseudo-terminal on Unix and a pseudo-console (ConPTY) on Windows, as a person at
# a terminal does.
portable-pty = "0.9"
# `trace` lets a state test run another connection in the middle of a read.
rusqlite = { version = "0.39", default-features = false, features = ["bundled", "trace"] }
skald-github-stand-in = { path = "../github-stand-in" }
skald-oidc-stand-in = { path = "../oidc-stand-in" }
skald-server = { path = "../server" }
socket2 = "0.6"
# SSH signatures of device keys the tests make, as a GitHub user's key would.
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["alloc", "ed25519"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54", features = ["net", "rt-multi-thread", "test-util", "time"] }
toml = "1.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
# The helper's socket: AF_UNIX, which std offers on Unix only.
uds_windows = "1.2"
windows-native-keyring-store = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
# setsid, which detaches the helper from the terminal of the command that starts it.
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }

[target.'cfg(unix)'.dev-dependencies]
# The browser tests' driver inherits no descriptor of the test binary but its standard streams.
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
# The tests list the processes of the copy of `skald` they run.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }
