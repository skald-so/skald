[package]
name = "skald-client"
description = "Skald client: CLI, MCP server and local helper."
version.workspace = true
edition.workspace = true
license.workspace = true

# dist builds and releases this package only: dist-workspace.toml.
[package.metadata.dist]
dist = true

[[bin]]
name = "skald"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
gethostname = "1"
keyring-core = "1"
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
skald-crypto = { path = "../crypto" }
skald-proto = { path = "../proto" }
tar = { version = "0.4", default-features = false }
tungstenite = "0.30"
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
zeroize = "1"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
axum = "0.8.9"
curve25519-dalek = "5"
# `trace` lets a state test run another connection in the middle of a read.
rusqlite = { version = "0.39", default-features = false, features = ["bundled", "trace"] }
skald-github-stand-in = { path = "../github-stand-in" }
skald-server = { path = "../server" }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54", features = ["net", "rt-multi-thread"] }
toml = "1.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
