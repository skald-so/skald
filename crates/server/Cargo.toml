[package]
name = "skald-server"
description = "Skald server."
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
http-body = "1.1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rusty-s3 = { version = "0.11", default-features = false, features = ["rustcrypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
skald-crypto = { path = "../crypto" }
skald-proto = { path = "../proto" }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
url = "2.5"

[dev-dependencies]
# The Sentry stand-in decodes compressed reports.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
jsonschema = { version = "0.61", default-features = false }
# An MLS client of the tests' own, apart from skald-crypto: external Commits, proposals and
# GroupInfo without extensions, as another implementation could send them, and KeyPackages that
# break the checks the server runs.
mls-rs = "0.58.0"
mls-rs-crypto-rustcrypto = "0.23"
serde_urlencoded = "0.7"
skald-github-stand-in = { path = "../github-stand-in" }
skald-oidc-stand-in = { path = "../oidc-stand-in" }
tungstenite = "0.30"

[target.'cfg(unix)'.dev-dependencies]
# The browser tests' driver inherits no descriptor of the test binary but its standard streams.
libc = "0.2"
