[package]
name = "skald-server"
description = "Skald server."
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
skald-crypto = { path = "../crypto" }
skald-proto = { path = "../proto" }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "time"] }
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
url = "2.5"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
serde_urlencoded = "0.7"
skald-github-stand-in = { path = "../github-stand-in" }
skald-oidc-stand-in = { path = "../oidc-stand-in" }
tungstenite = "0.30"

[features]
# Builds the acceptance tests of the OIDC code, written before that code.
# Remove this feature and the [[test]] entry below with that code.
acceptance = []

[[test]]
name = "oidc"
path = "tests/oidc/main.rs"
required-features = ["acceptance"]
