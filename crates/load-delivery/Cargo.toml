[package]
name = "skald-load-delivery"
description = "Short delivery measurements against a disposable local Skald server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skald-crypto = { path = "../crypto" }
skald-github-stand-in = { path = "../github-stand-in" }
skald-proto = { path = "../proto" }
tokio = { version = "1.54", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
ureq = { version = "3.5", default-features = false }
url = "2.5"

[dev-dependencies]
axum = "0.8.9"
# The recovery key's derivation at a test build's cost: `test-cost` of skald-crypto.
skald-crypto = { path = "../crypto", features = ["test-cost"] }
skald-server = { path = "../server" }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread"] }
