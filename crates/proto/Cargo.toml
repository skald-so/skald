[package]
name = "skald-proto"
description = "Skald wire protocol types."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ciborium-io = { version = "0.2", features = ["alloc"] }
ciborium-ll = "0.2"
getrandom = "0.4"
sha2 = { version = "0.11", default-features = false }

[features]
# Builds the acceptance tests of device certificates, written before the code they test.
# Remove this feature and the [[test]] entry below with that code.
acceptance = []

[[test]]
name = "certificates"
required-features = ["acceptance"]
