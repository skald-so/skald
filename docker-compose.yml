# The self-host stack: skald-server, PostgreSQL and Caddy for one domain. Setup, .env and the proxy
# variant: docs/self-host.md. script/self-host-test tests it.
name: skald

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    logging: *logging
    depends_on: [skald-server]
    environment:
      - SKALD_DOMAIN=${SKALD_DOMAIN:?set SKALD_DOMAIN in .env}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

  skald-server:
    image: ${SKALD_IMAGE:?set SKALD_IMAGE in .env}
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The bucket's and the sign-in providers' settings pass only when .env sets them. No cloud limit
    # is set: a self-hosted server applies none (docs/dev/architecture.md, "Cloud limits").
    environment:
      - SKALD_DATABASE_URL=postgres://skald:${SKALD_DATABASE_PASSWORD:?set SKALD_DATABASE_PASSWORD in .env}@postgres:5432/skald
      - SKALD_PUBLIC_URL=https://${SKALD_DOMAIN:?set SKALD_DOMAIN in .env}
      - SKALD_ATTACHMENTS_BUCKET
      - SKALD_ATTACHMENTS_BUCKET_ENDPOINT
      - SKALD_ATTACHMENTS_BUCKET_REGION
      - SKALD_ATTACHMENTS_BUCKET_ACCESS_KEY_ID
      - SKALD_ATTACHMENTS_BUCKET_SECRET_KEY
      - SKALD_GITHUB_CLIENT_ID
      - SKALD_GITHUB_CLIENT_SECRET
      - SKALD_GOOGLE_CLIENT_ID
      - SKALD_GOOGLE_CLIENT_SECRET
    volumes:
      - attachments:/var/lib/skald/attachments
    networks: [edge, database]

  postgres:
    # Renovate keeps it on major version 19: renovate.json.
    image: postgres:19rc2@sha256:3c5f322ffe97481b51a1ebee693f58d0c081514d2bc3026500a9400b7428bea9
    restart: unless-stopped
    logging: *logging
    environment:
      - POSTGRES_USER=skald
      - POSTGRES_DB=skald
      - POSTGRES_PASSWORD=${SKALD_DATABASE_PASSWORD:?set SKALD_DATABASE_PASSWORD in .env}
    # Over TCP: the first start's initialization runs a server on the socket only.
    healthcheck:
      test: [CMD, pg_isready, --host, localhost, --username, skald, --dbname, skald]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database:/var/lib/postgresql
    networks: [database]

  # The guide's backup and restore, `docker compose run --rm backup`; `up` leaves its profile off.
  # PostgreSQL's image, for pg_dump, psql and tar.
  backup:
    image: postgres:19rc2@sha256:3c5f322ffe97481b51a1ebee693f58d0c081514d2bc3026500a9400b7428bea9
    profiles: [backup]
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /backup
    environment:
      - PGHOST=postgres
      - PGUSER=skald
      - PGDATABASE=skald
      - PGPASSWORD=${SKALD_DATABASE_PASSWORD:?set SKALD_DATABASE_PASSWORD in .env}
      - SKALD_ATTACHMENTS_BUCKET
    volumes:
      - attachments:/backup/attachments
    networks: [database]

# edge: Caddy and the server; database: the server, PostgreSQL and the backup, without the internet.
networks:
  edge: {}
  database:
    internal: true

volumes:
  database: {}
  attachments: {}
  caddy-data: {}
  caddy-config: {}
