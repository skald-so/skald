[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The repository as a package, for release-plz: it counts a PR toward a package only when the PR
# changes the package's files. This package has every file outside crates/ and prototypes/: cargo
# leaves out each directory with a Cargo.toml of its own. Its CHANGELOG.md is the one of the
# release: release-plz.toml.
[package]
name = "skald-repository"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "repository.rs"

# The profile dist builds the release binaries with: dist-workspace.toml.
[profile.dist]
inherits = "release"
lto = "thin"
