[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The profile dist builds the release binaries with: dist-workspace.toml.
[profile.dist]
inherits = "release"
lto = "thin"

# Debug builds and tests: line tables only, enough for the file and line of each frame in our
# crates; no debug info in dependencies. A fresh target/ is about a third smaller.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
