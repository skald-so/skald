# cargo-deny policy, checked by script/test: dependency licenses and known vulnerabilities.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Defaults: vulnerabilities and unmaintained crates fail. An entry here needs a reason.
ignore = []

[licenses]
# Permissive licenses only: compatible with the `MIT OR Apache-2.0` crates and with the AGPL-3.0 server.
# Any other license needs a reviewed per-crate entry in `exceptions`.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"
exceptions = [
    # script/deny-test fails when another crate has a normal or build dependency on skald-server.
    { crate = "skald-server", allow = ["AGPL-3.0-only"] },
]
