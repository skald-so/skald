# cargo-deny policy, checked by script/test: dependency licenses and known vulnerabilities.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Defaults: vulnerabilities and unmaintained crates fail. An entry here needs a reason.
ignore = [
    # SQLite before 3.54 can return stale memory for a database opened with a crafted `-wal` file.
    # The client's state lives in the user's own 0700 directory, so the attacker would need the
    # user's rights already. rusqlite takes the fixed libsqlite3-sys 0.39 only from 0.41, and sqlx
    # 0.9 keeps libsqlite3-sys below 0.38: its unused SQLite driver is in Cargo.lock too. Drop this
    # once sqlx allows 0.39.
    { id = "RUSTSEC-2026-0459", reason = "local only; sqlx 0.9 holds libsqlite3-sys below the fix" },
]

[licenses]
# Permissive licenses only: compatible with the `MIT OR Apache-2.0` crates and with the AGPL-3.0 server.
# Any other license needs a reviewed per-crate entry in `exceptions`.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"
exceptions = [
    # script/deny-test fails when another crate has a normal or build dependency on skald-server.
    { crate = "skald-server", allow = ["AGPL-3.0-only"] },
]
