# cargo-nextest's settings for the workspace's tests: script/test and script/mutants.

# Unit tests start first. They take milliseconds; a mutant they catch then ends its run in
# script/mutants before a slower test starts, which nextest would let finish.
[[profile.default.overrides]]
filter = 'kind(lib) | kind(bin)'
priority = 100

# Tests that time the client run alone, as under cargo test. Nextest runs each in its own process.
[[profile.default.overrides]]
filter = 'package(skald-client) & binary(recv_wait) & test(=sessions::sessions_in_two_folders_wait_through_one_helper_and_each_gets_only_its_own_messages)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(skald-client) & binary(transport_fallback) & test(=send_and_recv_exit_at_the_end_of_catch_up_over_sse_and_long_poll)'
threads-required = 'num-test-threads'
